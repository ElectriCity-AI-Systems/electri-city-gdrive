name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q electridrive server tests

      - name: Import smoke check
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -c "import electridrive, electridrive.cli,
          electridrive.google_api.client, electridrive.sync.engine,
          electridrive.sync.twoway, electridrive.vfs.fuse_mount,
          electridrive.updater.update_checker, electridrive.ui.app,
          electridrive.ui.update_controller, server.license_server"

  debian-package:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install package build tools and Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils dbus-x11 desktop-file-utils libegl1 libgl1 libgtk-3-bin libxkbcommon-x11-0 libxcb-cursor0 procps xauth xvfb

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: packaging/requirements-release.txt

      - name: Install pinned release dependencies
        run: python -m pip install --requirement packaging/requirements-release.txt

      - name: Build and verify Debian package on the GLIBC 2.35 baseline
        env:
          PY: python
          MAX_GLIBC_VERSION: "2.35"
        run: bash scripts/build_deb.sh

      - name: Install and launch the built package from terminal and desktop entry
        run: |
          sudo apt-get install -y ./dist/deb/electridrive_*_amd64.deb
          profile="$(mktemp -d)"
          mkdir -p "$profile/config" "$profile/state" "$profile/cache" "$profile/runtime"
          chmod 700 "$profile/runtime"

          set +e
          QT_QPA_PLATFORM=offscreen \
          XDG_CONFIG_HOME="$profile/config" \
          XDG_STATE_HOME="$profile/state" \
          XDG_CACHE_HOME="$profile/cache" \
          XDG_RUNTIME_DIR="$profile/runtime" \
            timeout 5 /usr/bin/electridrive
          status=$?
          set -e
          test "$status" -eq 124

          # shellcheck disable=SC2016
          QT_QPA_PLATFORM=xcb \
          XDG_CONFIG_HOME="$profile/config" \
          XDG_STATE_HOME="$profile/state" \
          XDG_CACHE_HOME="$profile/cache" \
          XDG_RUNTIME_DIR="$profile/runtime" \
            dbus-run-session -- xvfb-run -a bash -euo pipefail -c '
              gtk-launch electridrive >menu.out 2>menu.err &
              launcher=$!
              sleep 5
              if ! pgrep -x electridrive; then
                cat menu.out menu.err >&2
                ps -eo pid,ppid,comm,args >&2
                wait "$launcher" 2>/dev/null || true
                exit 1
              fi
              pkill -TERM -x electridrive
              wait "$launcher" 2>/dev/null || true
            '

      - name: Upload verified Debian package
        uses: actions/upload-artifact@v6
        with:
          name: electridrive-debian-${{ github.sha }}
          path: dist/deb/*.deb
          if-no-files-found: error
