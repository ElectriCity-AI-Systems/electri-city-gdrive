name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q electridrive server tests

      - name: Import smoke check
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -c "import electridrive, electridrive.cli,
          electridrive.google_api.client, electridrive.sync.engine,
          electridrive.sync.twoway, electridrive.vfs.fuse_mount,
          electridrive.updater.update_checker, electridrive.ui.app,
          electridrive.ui.update_controller, server.license_server"
