name: Customer release candidate (requires live OAuth acceptance)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  customer-candidate:
    runs-on: ubuntu-22.04
    environment: customer-release
    steps:
      - uses: actions/checkout@v7

      - name: Require publisher OAuth + Picker configuration
        env:
          ELECTRIDRIVE_APP_CLIENT_JSON: ${{ secrets.ELECTRIDRIVE_APP_CLIENT_JSON }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "$ELECTRIDRIVE_APP_CLIENT_JSON" ]; then
            echo "RELEASE BLOCKED: configure customer-release secret ELECTRIDRIVE_APP_CLIENT_JSON" >&2
            exit 1
          fi
          printf '%s' "$ELECTRIDRIVE_APP_CLIENT_JSON" > "$RUNNER_TEMP/customer-client.json"
          python3 scripts/validate_distribution_oauth.py "$RUNNER_TEMP/customer-client.json"

      - name: Install Linux GUI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libfuse2 fuse3

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Run complete regression tests and compile checks
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q
          python -m compileall -q electridrive server tests

      - name: Build customer .deb with validated publisher credentials
        env:
          ELECTRIDRIVE_APP_CLIENT_FILE: ${{ runner.temp }}/customer-client.json
        run: |
          set -euo pipefail
          unset ALLOW_PLACEHOLDER_CLIENT
          bash scripts/build_deb_in_container.sh
          python scripts/verify_deb.py dist/electridrive_*_amd64.deb \
            --expected-version 2.1.3 --max-glibc 2.35 --require-baked-client
          dpkg-deb --contents dist/electridrive_*_amd64.deb > "$RUNNER_TEMP/package-contents.txt"
          if grep -F 'QA-NOT-FOR-DISTRIBUTION.txt' "$RUNNER_TEMP/package-contents.txt"; then
            echo "RELEASE BLOCKED: customer artifact has QA-only marker" >&2
            exit 1
          fi

      - name: Upload signed-off candidate for real Google login acceptance
        uses: actions/upload-artifact@v6
        with:
          name: CUSTOMER-CANDIDATE-NEEDS-LIVE-OAUTH-ACCEPTANCE-${{ github.sha }}
          path: |
            dist/electridrive_*_amd64.deb
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Remove temporary publisher client JSON
        if: always()
        run: rm -f "$RUNNER_TEMP/customer-client.json"
