name: Customer candidate (manual, no publishing)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    if: github.repository == 'ElectriCity-AI-Systems/electri-city-gdrive' && github.ref == 'refs/heads/main'
    environment: customer-candidate
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      ELECTRIDRIVE_BUILD_CHANNEL: CUSTOMER-CANDIDATE
      PY: .venv/bin/python

    steps:
      - name: Check out protected main
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install runtime verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils dbus-x11 desktop-file-utils libasound2 libbrotli1 \
            libcups2 libdbus-1-3 libegl1 libfuse2 fuse3 libfontconfig1 libfreetype6 \
            libgl1 libglib2.0-0 libgtk-3-0 libnspr4 libnss3 libpulse0 \
            libwayland-cursor0 libwayland-egl1 libxcomposite1 libxdamage1 \
            libxkbcommon-x11-0 libxkbfile1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxrandr2 libxtst6 procps x11-utils xauth xvfb

      - name: Install pinned release build dependencies
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Create the pinned release build environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --requirement packaging/requirements-release.txt

      - name: Build customer candidate from protected environment config
        env:
          ELECTRIDRIVE_APP_CLIENT_JSON: ${{ secrets.ELECTRIDRIVE_APP_CLIENT_JSON }}
          ELECTRIDRIVE_APP_CLIENT_FILE: ${{ runner.temp }}/publisher-app-client.json
          ELECTRIDRIVE_PICKER_API_KEY: ${{ secrets.ELECTRIDRIVE_PICKER_API_KEY }}
        run: |
          test -n "$ELECTRIDRIVE_APP_CLIENT_JSON"
          test -n "$ELECTRIDRIVE_PICKER_API_KEY"
          trap 'rm -f "$ELECTRIDRIVE_APP_CLIENT_FILE"' EXIT
          printf '%s' "$ELECTRIDRIVE_APP_CLIENT_JSON" > "$ELECTRIDRIVE_APP_CLIENT_FILE"
          chmod 600 "$ELECTRIDRIVE_APP_CLIENT_FILE"
          bash scripts/build_release.sh
          test "$(dpkg-deb --field dist/electridrive_2.1.3_amd64.deb Version)" = "2.1.3"

      - name: Install and launch the exact .deb and AppImage
        run: |
          profile="$(mktemp -d)"
          mkdir -p "$profile/config" "$profile/state" "$profile/cache" "$profile/runtime"
          chmod 700 "$profile/runtime"
          sudo apt-get install -y ./dist/electridrive_2.1.3_amd64.deb

          XDG_CONFIG_HOME="$profile/config" XDG_STATE_HOME="$profile/state" \
          XDG_CACHE_HOME="$profile/cache" /usr/bin/electridrive --doctor
          QT_QPA_PLATFORM=offscreen XDG_CONFIG_HOME="$profile/config" \
          XDG_STATE_HOME="$profile/state" XDG_CACHE_HOME="$profile/cache" \
          XDG_RUNTIME_DIR="$profile/runtime" timeout 5 /usr/bin/electridrive || test "$?" -eq 124

          QT_QPA_PLATFORM=offscreen XDG_CONFIG_HOME="$profile/config" \
          XDG_STATE_HOME="$profile/state" XDG_CACHE_HOME="$profile/cache" \
          XDG_RUNTIME_DIR="$profile/runtime" \
            ./dist/ElectriDrive-x86_64.AppImage --appimage-extract-and-run --doctor
          set +e
          QT_QPA_PLATFORM=offscreen XDG_CONFIG_HOME="$profile/config" \
          XDG_STATE_HOME="$profile/state" XDG_CACHE_HOME="$profile/cache" \
          XDG_RUNTIME_DIR="$profile/runtime" timeout 5 \
            ./dist/ElectriDrive-x86_64.AppImage --appimage-extract-and-run
          status=$?
          set -e
          test "$status" -eq 124

          QT_QPA_PLATFORM=xcb XDG_CONFIG_HOME="$profile/config" \
          XDG_STATE_HOME="$profile/state" XDG_CACHE_HOME="$profile/cache" \
          XDG_RUNTIME_DIR="$profile/runtime" \
            xvfb-run -a dbus-run-session -- bash -euo pipefail -c '
              set +e
              timeout 8 /usr/bin/electridrive
              status=$?
              test "$status" -eq 124
            '

          QT_QPA_PLATFORM=xcb XDG_CONFIG_HOME="$profile/config" \
          XDG_STATE_HOME="$profile/state" XDG_CACHE_HOME="$profile/cache" \
          XDG_RUNTIME_DIR="$profile/runtime" \
            xvfb-run -a dbus-run-session -- bash -euo pipefail -c '
              set +e
              timeout 8 ./dist/ElectriDrive-x86_64.AppImage --appimage-extract-and-run
              status=$?
              test "$status" -eq 124
            '

      - name: Upload candidate artifacts (not a release)
        uses: actions/upload-artifact@v6
        with:
          name: electridrive-2.1.3-customer-candidate-${{ github.sha }}
          path: |
            dist/electridrive_2.1.3_amd64.deb
            dist/ElectriDrive-x86_64.AppImage
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
