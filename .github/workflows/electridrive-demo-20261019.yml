name: Publish ElectriDrive Demo Video

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/electridrive-demo-20261019.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: electridrive-one-time-demo
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'ElectriCity-AI-Systems/electri-city-gdrive'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Render English demo from repository UI screenshots
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg
          command -v ffprobe
          command -v gh
          FONT="/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          FONT_BOLD="/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          test -f "$FONT"
          test -f "$FONT_BOLD"
          mkdir -p dist/demo-scenes
          for img in login explorer transfers virtual-drive; do
            test -s "assets/screenshots/$img.png"
          done

          title_card() {
            local index="$1" duration="$2" heading="$3" detail="$4"
            ffmpeg -hide_banner -loglevel error -y \
              -f lavfi -i "color=c=0x0A101A:s=1280x720:r=24" -t "$duration" \
              -vf "drawbox=x=0:y=0:w=24:h=720:color=0x23C6DF:t=fill,drawtext=fontfile=$FONT_BOLD:text='$heading':fontcolor=white:fontsize=52:x=(w-text_w)/2:y=290,drawtext=fontfile=$FONT:text='$detail':fontcolor=0xB7CDDB:fontsize=25:x=(w-text_w)/2:y=380,format=yuv420p" \
              -r 24 -an -c:v libx264 -preset veryfast -crf 22 -pix_fmt yuv420p \
              "dist/demo-scenes/$index.mp4"
          }

          screenshot_scene() {
            local index="$1" duration="$2" filename="$3" heading="$4" detail="$5"
            ffmpeg -hide_banner -loglevel error -y \
              -loop 1 -framerate 24 -i "assets/screenshots/$filename.png" -t "$duration" \
              -vf "scale=1110:710:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2:color=0x0A101A,drawbox=x=0:y=565:w=1280:h=155:color=0x05090F@0.91:t=fill,drawtext=fontfile=$FONT_BOLD:text='$heading':fontcolor=white:fontsize=31:x=46:y=586,drawtext=fontfile=$FONT:text='$detail':fontcolor=0xCAE1EA:fontsize=21:x=46:y=641,format=yuv420p" \
              -r 24 -an -c:v libx264 -preset veryfast -crf 22 -pix_fmt yuv420p \
              "dist/demo-scenes/$index.mp4"
          }

          title_card 00 4 "ELECTRIDRIVE 2.1.3" "Google Drive for Linux - a quick UI tour"
          screenshot_scene 01 8 login "CONNECT GOOGLE DRIVE" "Launch the app and choose Connect Google Drive."
          screenshot_scene 02 9 explorer "EXPLORE YOUR FILES" "Browse folders, search, and add existing Drive files."
          screenshot_scene 03 9 transfers "UPLOAD AND DOWNLOAD" "Track transfers, progress, retries, and cancellations."
          screenshot_scene 04 8 explorer "TWO-WAY FOLDER SYNC" "Keep local and Drive folders in sync. Conflicts keep both."
          screenshot_scene 05 8 virtual-drive "FILES ON DEMAND" "Mount a read-only virtual Drive with local caching."
          title_card 06 4 "READY TO EXPLORE?" "Free and open source - ElectriCity-AI-Systems"

          printf "file '00.mp4'\nfile '01.mp4'\nfile '02.mp4'\nfile '03.mp4'\nfile '04.mp4'\nfile '05.mp4'\nfile '06.mp4'\n" > dist/demo-scenes/concat.txt
          ffmpeg -hide_banner -loglevel error -y \
            -f concat -safe 0 -i dist/demo-scenes/concat.txt -c copy \
            dist/ElectriDrive_2.1.3_Demo_EN.mp4

          test -s dist/ElectriDrive_2.1.3_Demo_EN.mp4
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,width,height \
            -of default=noprint_wrappers=1 dist/ElectriDrive_2.1.3_Demo_EN.mp4
          ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1 dist/ElectriDrive_2.1.3_Demo_EN.mp4
          ffmpeg -hide_banner -loglevel error -xerror -i dist/ElectriDrive_2.1.3_Demo_EN.mp4 \
            -f null -

      - name: Upload video to existing v2.1.3 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v2.1.3 --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload v2.1.3 \
            dist/ElectriDrive_2.1.3_Demo_EN.mp4 --clobber --repo "$GITHUB_REPOSITORY"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v2.1.3" \
            --jq '.assets[] | select(.name=="ElectriDrive_2.1.3_Demo_EN.mp4") | .browser_download_url' \
            | grep -F 'ElectriDrive_2.1.3_Demo_EN.mp4'

      - name: Answer the demo request on issue 4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          marker='ElectriDrive demo video (v2.1.3)'
          if gh api --paginate "repos/$GITHUB_REPOSITORY/issues/4/comments" \
            --jq '.[].body' | grep -Fq "$marker"; then
            echo "Demo comment already present. Skipping duplicate."
          else
            gh issue comment 4 --repo "$GITHUB_REPOSITORY" --body "$(cat <<'EOF'
          Thanks for your interest! Here is the **ElectriDrive demo video (v2.1.3)** showing the interface and the main workflow.

          🎬 **[Watch or download the ElectriDrive demo (MP4)](https://github.com/ElectriCity-AI-Systems/electri-city-gdrive/releases/download/v2.1.3/ElectriDrive_2.1.3_Demo_EN.mp4)**

          The short English walkthrough covers Google Drive sign-in, file browsing, uploads and downloads, two-way folder sync, and the read-only virtual drive.

          **Note:** This is an illustrated walkthrough assembled from the project's UI screenshots, rather than a live screen capture.

          [Source code and installation instructions](https://github.com/ElectriCity-AI-Systems/electri-city-gdrive#install)
          EOF
            )"
          fi
