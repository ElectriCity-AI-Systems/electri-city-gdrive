name: Publish ElectriDrive 2.1.3

# Publishes only the owner-approved v2.1.3. Future version bumps do not publish.
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-2.1.3.yml]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: electridrive-release-2.1.3
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'ElectriCity-AI-Systems/electri-city-gdrive' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install runtime verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2t64 fuse3 libglib2.0-0t64 libegl1 libgl1 libwayland-cursor0 libwayland-egl1
      - name: Verify and publish the owner-approved release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/publish_release_2_1_3.py
      - name: Retain release package and verification record
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: electridrive-release-2.1.3
          path: dist/release-2.1.3/
          if-no-files-found: ignore
